name: Unturned iOS IPA Derleyici (Minecraft Tarzi Mobil Kontrol)

on:
  workflow_dispatch:

jobs:
  build_ios:
    name: iOS IPA Olustur
    runs-on: macos-latest
    steps:
      - name: Kodlari Indir
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Haritalari Sil ve Steamworks Kapat
        run: |
          rm -rf Builds/Shared/Maps/Russia Builds/Shared/Maps/Germany Builds/Shared/Maps/Washington Builds/Shared/Maps/Yukon
          sed -i '' 's/iPhone: /iPhone: DISABLESTEAMWORKS;DISABLEBATTLEYE;/' ProjectSettings/ProjectSettings.asset

      - name: Minecraft Tarzi Mobil Kontrolleri Entegre Et
        run: |
          mkdir -p Assets/Unturned/Scripts
          cat << 'EOF' > Assets/Unturned/Scripts/MobileTouchControls.cs
          using UnityEngine;
          using SDG.Unturned;

          public class MobileTouchControls : MonoBehaviour
          {
              public static Vector2 moveDir;
              public static Vector2 lookDelta;
              public static bool isJumping, isFiring, isAiming, isSprinting;

              private int moveFingerId = -1;
              private int lookFingerId = -1;
              private Vector2 moveCenter;
              private Vector2 lastLookPos;
              private Texture2D btnTex, joyBgTex;

              [RuntimeInitializeOnLoadMethod(RuntimeInitializeLoadType.AfterSceneLoad)]
              static void Init()
              {
                  GameObject go = new GameObject("MinecraftStyleMobileHUD");
                  DontDestroyOnLoad(go);
                  go.AddComponent<MobileTouchControls>();
              }

              void Start()
              {
                  btnTex = new Texture2D(1, 1);
                  btnTex.SetPixel(0, 0, new Color(0.1f, 0.1f, 0.1f, 0.45f));
                  btnTex.Apply();

                  joyBgTex = new Texture2D(1, 1);
                  joyBgTex.SetPixel(0, 0, new Color(1f, 1f, 1f, 0.25f));
                  joyBgTex.Apply();

                  moveCenter = new Vector2(Screen.height * 0.35f, Screen.height * 0.72f);
              }

              void Update()
              {
                  lookDelta = Vector2.zero;
                  if (Player.player == null || PlayerDashboardUI.active || PlayerPauseUI.active) 
                  {
                      moveDir = Vector2.zero;
                      return;
                  }

                  float padRadius = Screen.height * 0.22f;

                  foreach (Touch t in Input.touches)
                  {
                      Vector2 guiPos = new Vector2(t.position.x, Screen.height - t.position.y);

                      if (t.phase == TouchPhase.Began && t.position.x < Screen.width * 0.4f && t.position.y < Screen.height * 0.65f && moveFingerId == -1)
                      {
                          moveFingerId = t.fingerId;
                      }

                      if (t.fingerId == moveFingerId)
                      {
                          if (t.phase == TouchPhase.Moved || t.phase == TouchPhase.Stationary)
                          {
                              Vector2 diff = guiPos - moveCenter;
                              moveDir = Vector2.ClampMagnitude(diff / (padRadius * 0.6f), 1f);
                              moveDir.y = -moveDir.y;
                              isSprinting = diff.magnitude > (padRadius * 0.55f);
                          }
                          else if (t.phase == TouchPhase.Ended || t.phase == TouchPhase.Canceled)
                          {
                              moveFingerId = -1;
                              moveDir = Vector2.zero;
                              isSprinting = false;
                          }
                      }
                      else if (t.position.x >= Screen.width * 0.4f)
                      {
                          if (t.phase == TouchPhase.Began && lookFingerId == -1)
                          {
                              lookFingerId = t.fingerId;
                              lastLookPos = t.position;
                          }
                          else if (t.fingerId == lookFingerId && t.phase == TouchPhase.Moved)
                          {
                              lookDelta = (t.position - lastLookPos) * 0.18f;
                              lastLookPos = t.position;
                          }
                          else if (t.fingerId == lookFingerId && (t.phase == TouchPhase.Ended || t.phase == TouchPhase.Canceled))
                          {
                              lookFingerId = -1;
                          }
                      }
                  }
              }

              void OnGUI()
              {
                  if (Player.player == null || PlayerPauseUI.active) return;

                  GUIStyle style = new GUIStyle(GUI.skin.button);
                  style.normal.background = btnTex;
                  style.active.background = joyBgTex;
                  style.normal.textColor = new Color(1f, 1f, 1f, 0.85f);
                  float u = Screen.height / 7.5f;
                  style.fontSize = Mathf.RoundToInt(u * 0.24f);

                  float topW = u * 0.95f;
                  float startX = (Screen.width * 0.5f) - (topW * 2.5f);
                  if (GUI.Button(new Rect(startX, 15, topW, u * 0.65f), "1. Silah", style))
                      Player.player.equipment.ServerEquip(0, 0, 0);
                  if (GUI.Button(new Rect(startX + topW * 1.05f, 15, topW, u * 0.65f), "2. Silah", style))
                      Player.player.equipment.ServerEquip(1, 0, 0);
                  if (GUI.Button(new Rect(startX + topW * 2.1f, 15, topW * 1.1f, u * 0.65f), "••• Çanta", style))
                  {
                      if (PlayerDashboardUI.active) PlayerDashboardUI.close();
                      else PlayerDashboardUI.open();
                  }
                  if (GUI.Button(new Rect(startX + topW * 3.3f, 15, topW * 0.9f, u * 0.65f), "II Menü", style))
                  {
                      PlayerPauseUI.open();
                  }

                  if (PlayerDashboardUI.active) return;

                  float cx = moveCenter.x;
                  float cy = moveCenter.y;
                  GUI.Box(new Rect(cx - u * 0.5f, cy - u * 1.55f, u, u), "▲", style);
                  GUI.Box(new Rect(cx - u * 0.5f, cy + u * 0.55f, u, u), "▼", style);
                  GUI.Box(new Rect(cx - u * 1.55f, cy - u * 0.5f, u, u), "◀", style);
                  GUI.Box(new Rect(cx + u * 0.55f, cy - u * 0.5f, u, u), "▶", style);

                  if (GUI.Button(new Rect(cx - u * 0.5f, cy - u * 0.5f, u, u), "Eğil", style))
                  {
                      if (Player.player.stance.stance == EPlayerStance.CROUCH)
                          Player.player.stance.checkStance(EPlayerStance.STAND);
                      else
                          Player.player.stance.checkStance(EPlayerStance.CROUCH);
                  }

                  isJumping = GUI.RepeatButton(new Rect(Screen.width - u * 1.35f, Screen.height - u * 1.6f, u * 1.1f, u * 1.1f), "Zıpla", style);
                  isFiring = GUI.RepeatButton(new Rect(Screen.width - u * 2.75f, Screen.height - u * 2.2f, u * 1.25f, u * 1.25f), "ATEŞ /\nVUR", style);
                  isAiming = GUI.RepeatButton(new Rect(Screen.width - u * 1.35f, Screen.height - u * 2.9f, u * 1.1f, u * 1.0f), "Nişan", style);

                  if (GUI.Button(new Rect(Screen.width - u * 2.75f, Screen.height - u * 3.4f, u * 1.15f, u * 0.95f), "Etkileşim\n(Al / Bin)", style))
                  {
                      PlayerInteract.interact();
                  }

                  if (GUI.Button(new Rect(Screen.width - u * 4.0f, Screen.height - u * 1.4f, u * 1.05f, u * 0.9f), "Şarjör\n(R)", style))
                  {
                      Player.player.equipment.sendSlot(0);
                  }
              }
          }
          EOF

      - name: Unity ile Xcode Projesi Cikar
        uses: game-ci/unity-builder@v4
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          projectPath: .
          targetPlatform: iOS
          buildsPath: build

      - name: Imzasiz IPA Paketle
        run: |
          cd build/iOS/iOS
          xcodebuild -project Unity-iPhone.xcodeproj -scheme Unity-iPhone -configuration Release -sdk iphoneos build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          mkdir Payload
          cp -r build/Release-iphoneos/*.app Payload/
          zip -r Unturned-iOS.ipa Payload

      - name: IPA Dosyasini Indirmeye Sun
        uses: actions/upload-artifact@v4
        with:
          name: Unturned-iOS-IPA
          path: build/iOS/iOS/Unturned-iOS.ipa
